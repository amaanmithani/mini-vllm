[project]
name = "minivllm"
version = "0.1.0"
description = "A small vLLM: paged KV cache, continuous batching, OpenAI-compatible server, for Qwen2.5"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["torch>=2.4", "safetensors>=0.4", "tokenizers>=0.20", "huggingface-hub>=0.24"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
minivllm = "minivllm.server:main"

[dependency-groups]
dev = [
  "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27",
  "transformers>=4.45", "fastapi>=0.110", "uvicorn>=0.29",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"bench/*" = ["E501", "RUF001", "SIM115"]
"kaggle/*" = ["E501"]

[tool.mypy]
packages = ["minivllm"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["minivllm"]
branch = true

[tool.coverage.report]
show_missing = true
